name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run repository gate
        shell: pwsh
        run: pwsh -NoProfile -File .\tools\verify.ps1
