name: Bug report
description: Report a reproducible defect in a shared contract or core.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: capability
    attributes:
      label: Capability
      options:
        - audio or host audio
        - device control
        - BLE pairing or Windows BLE
        - battery, power, or device health
        - observability
        - voice activation or speaker verification
        - OTA
        - release tooling
        - other
    validations:
      required: true
  - type: input
    id: revisions
    attributes:
      label: Revisions
      description: Platform commit and relevant product versions or commits.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the input, state transition, and smallest useful redacted evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Private data
      options:
        - label: I removed credentials, personal data, recordings, transcripts, and device identifiers.
          required: true
